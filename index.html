    <style>
        body {

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-color: rgba(99, 102, 241, 0.5);

        }

        .btn-option {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);

        }

            transform: translateY(-2px);

<body class="min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-indigo-500 selection:text-white">

        /* ==========================================================================
           2. SÍNTESE DE ÁUDIO WEB AUDIO API (SEM DEPENDÊNCIAS EXTERNAS)
           ========================================================================== */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playCorrect() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc1.type = 'sine';
                osc2.type = 'triangle';

                // Arpejo alegre C5 (523Hz) -> E5 (659Hz) -> G5 (784Hz)
                osc1.frequency.setValueAtTime(523.25, now);
                osc1.frequency.setValueAtTime(659.25, now + 0.08);
                osc1.frequency.setValueAtTime(783.99, now + 0.16);

                osc2.frequency.setValueAtTime(261.63, now);
                osc2.frequency.setValueAtTime(329.63, now + 0.08);
                osc2.frequency.setValueAtTime(392.00, now + 0.16);

                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.45);
                osc2.stop(now + 0.45);
            }

            playIncorrect() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.28);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.28);
            }

            playVictory() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + (idx * 0.12);
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.35);
                });
            }
        }

                    <button onclick="startGame()" class="w-full py-5 rounded-2xl font-display font-black text-lg sm:text-xl text-slate-950 bg-gradient-to-r from-amber-400 via-yellow-300 to-emerald-400 hover:brightness-110 shadow-xl shadow-amber-500/20 transform hover:-translate-y-1 transition-all flex items-center justify-center gap-3">
                        <span>INICIAR DESAFIO COMPLETO</span>
                        <svg class="w-6 h-6 stroke-slate-950 stroke-[3]" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 12h15"/></svg>
                    </button>
                </div>
            `;
        }

        function startGame() {
            state.currentPhaseIdx = 0;
            state.currentQuestionIdx = 0;
            state.score = 0;
            state.streak = 0;
            state.correctCount = 0;
            state.wrongCount = 0;
            state.answersHistory = [];
            
            updateHeaderCounters();
            renderQuestion();
        }

        function updateHeaderCounters() {
            document.getElementById('globalScore').innerText = state.score;
            document.getElementById('globalStreak').innerText = `🔥 ${state.streak}`;
        }

        function renderQuestion() {
            const currentPhase = gameData.phases[state.currentPhaseIdx];
            const q = currentPhase.questions[state.currentQuestionIdx];
            const totalQuestionsInPhase = currentPhase.questions.length;
            const globalQNum = (state.currentPhaseIdx * 5) + state.currentQuestionIdx + 1;

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="space-y-4 my-2">
                    <!-- Barra de Progresso da Fase -->
                    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-lg">
                        <div class="flex items-center gap-3 w-full sm:w-auto">
                            <span class="px-3 py-1 rounded-lg text-xs font-black uppercase text-slate-950 bg-gradient-to-r ${currentPhase.badgeColor}">
                                ${currentPhase.title.split(':')[0]}
                            </span>
                            <span class="text-xs text-slate-300 font-semibold">Questão ${globalQNum} de 15</span>
                        </div>
                        <div class="w-full sm:w-64 bg-slate-800 h-3 rounded-full overflow-hidden p-0.5 border border-slate-700">
                            <div class="bg-gradient-to-r ${currentPhase.badgeColor} h-full rounded-full transition-all duration-300" style="width: ${((state.currentQuestionIdx + 1) / totalQuestionsInPhase) * 100}%"></div>
                        </div>
                    </div>

                    <!-- Card principal da questão -->
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                        
                        <!-- Coluna da Esquerda: Enunciado e Gráfico 3D -->
                        <div class="lg:col-span-6 glass-card rounded-3xl p-5 sm:p-6 space-y-4 border border-slate-800">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider bg-indigo-500/10 px-2.5 py-1 rounded-md border border-indigo-500/20">
                                    📌 ${q.category}
                                </span>
                                <button onclick="openHintModal()" class="text-xs font-bold text-amber-400 hover:text-amber-300 bg-amber-500/10 hover:bg-amber-500/20 px-3 py-1.5 rounded-xl border border-amber-500/30 transition-all flex items-center gap-1.5">
                                    <span>💡 Dica da Profe</span>
                                </button>
                            </div>

                            <h3 class="font-sans font-bold text-base sm:text-lg text-slate-100 leading-snug">
                                ${q.question}
                            </h3>

                            <!-- Ilustração Vetorial 3D -->
                            <div class="bg-slate-950/80 rounded-2xl p-4 border border-slate-800 flex items-center justify-center relative">
                                ${getSVGGraphic(q.svgType)}
                            </div>
                        </div>

                        <!-- Coluna da Direita: Botões GRANDES de Resposta -->
                        <div class="lg:col-span-6 space-y-3">
                            <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Escolha a alternativa correta:</span>
                            
                            ${q.options.map((opt, idx) => {
                                const letters = ['A', 'B', 'C', 'D'];
                                return `
                                    <button onclick="checkAnswer(${idx})" class="btn-option w-full p-4 rounded-2xl bg-slate-900 hover:bg-slate-800 border-2 border-slate-800 hover:border-indigo-500/70 text-left flex items-center gap-4 group transition-all">
                                        <span class="w-10 h-10 rounded-xl bg-slate-800 group-hover:bg-indigo-600 group-hover:text-white font-display font-black text-slate-300 text-base flex items-center justify-center shrink-0 border border-slate-700 transition-colors">
                                            ${letters[idx]}
                                        </span>
                                        <span class="font-semibold text-slate-200 group-hover:text-white text-sm sm:text-base leading-snug">
                                            ${opt}
                                        </span>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        /* ==========================================================================
           6. LÓGICA DE RESPOSTA E FEEDBACK DIDÁTICO
           ========================================================================== */
        function checkAnswer(selectedIdx) {
            const currentPhase = gameData.phases[state.currentPhaseIdx];
            const q = currentPhase.questions[state.currentQuestionIdx];
            const isCorrect = (selectedIdx === q.correct);

            if (isCorrect) {
                audio.playCorrect();
                state.score += 100 + (state.streak * 25);
                state.streak++;
                state.correctCount++;
            } else {
                audio.playIncorrect();
                state.streak = 0;
                state.wrongCount++;
            }

            // Registrar histórico para a revisão final
            state.answersHistory.push({
                question: q.question,
                category: q.category,
                userAnswer: q.options[selectedIdx],
                correctAnswer: q.options[q.correct],
                isCorrect: isCorrect,
                explanation: q.explanation
            });

            updateHeaderCounters();
            showFeedbackModal(isCorrect, q);
        }

        function showFeedbackModal(isCorrect, questionObj) {
            const modal = document.getElementById('feedbackModal');
            const header = document.getElementById('feedbackHeader');
            const body = document.getElementById('feedbackBody');

            if (isCorrect) {
                header.innerHTML = `
                    <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-2xl font-bold">✓</div>
                    <div>
                        <h4 class="font-display font-extrabold text-xl text-emerald-400">Excelente! Resposta Correta! 🎉</h4>
                        <p class="text-xs text-slate-400">+${100 + ((state.streak - 1) * 25)} pontos (Combo 🔥 ${state.streak})</p>
                    </div>
                `;
            } else {
                header.innerHTML = `
                    <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 border border-rose-500/30 flex items-center justify-center text-2xl font-bold">✕</div>
                    <div>
                        <h4 class="font-display font-extrabold text-xl text-rose-400">Atenção! Resposta Incorreta 💡</h4>
                        <p class="text-xs text-slate-400">Veja a resolução passo a passo da Profe abaixo:</p>
                    </div>
                `;
            }

            body.innerHTML = questionObj.explanation;
            modal.classList.remove('hidden');
        }

        function nextQuestion() {
            document.getElementById('feedbackModal').classList.add('hidden');

            const currentPhase = gameData.phases[state.currentPhaseIdx];
            state.currentQuestionIdx++;

            // Se terminou as questões da fase atual
            if (state.currentQuestionIdx >= currentPhase.questions.length) {
                state.currentPhaseIdx++;
                state.currentQuestionIdx = 0;

                // Se completou as 3 fases -> Mostrar Tela Final de Resultados
                if (state.currentPhaseIdx >= gameData.phases.length) {
                    renderFinalResults();
                    return;
                }
            }

            renderQuestion();
        }

        function openHintModal() {
            const q = gameData.phases[state.currentPhaseIdx].questions[state.currentQuestionIdx];
            document.getElementById('hintContent').innerHTML = q.hint;
            document.getElementById('hintModal').classList.remove('hidden');
        }

        function closeHintModal() {
            document.getElementById('hintModal').classList.add('hidden');
        }

        /* ==========================================================================
           7. TELA FINAL COM ANIMAÇÃO DE ESTRELAS, CELEBRAÇÃO E RELATÓRIO COMPLETO
           ========================================================================== */
        function renderFinalResults() {
            audio.playVictory();
            launchConfetti();

            const total = 15;
            const percentage = Math.round((state.correctCount / total) * 100);

            // Regra do Sistema de Estrelas:
            // < 60% = 1 Estrela
            // 60% - 89% = 2 Estrelas
            // >= 90% = 3 Estrelas
            let starsCount = 1;
            let starsMsg = "Você concluiu a revisão! Continue praticando os conceitos de volume e projeções ortogonais.";
            let teacherBadge = "Aprendiz de Geometria";

            if (percentage >= 90) {
                starsCount = 3;
                starsMsg = "SENSACIONAL! Você dominou todos os conceitos e está pronto para gabaritar a prova de Matemática no ENEM!";
                teacherBadge = "Mestre da Geometria ENEM 🏆";
            } else if (percentage >= 60) {
                starsCount = 2;
                starsMsg = "MUITO BEM! Demonstrou ótimo conhecimento em fórmulas. Revise apenas conversão de escala k³ e volume de truncados.";
                teacherBadge = "Candidato de Alto Nível 🚀";
            }

            // Gerar HTML dinâmico das 3 estrelas com animação
            let starsHTML = '';
            for (let i = 1; i <= 3; i++) {
                if (i <= starsCount) {
                    starsHTML += `<span class="text-5xl sm:text-6xl text-amber-400 animate-star-pop drop-shadow-[0_0_20px_rgba(251,191,36,0.7)]" style="animation-delay: ${i * 0.25}s">★</span>`;
                } else {
                    starsHTML += `<span class="text-5xl sm:text-6xl text-slate-700">★</span>`;
                }
            }

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="max-w-3xl mx-auto w-full glass-card rounded-3xl p-6 sm:p-10 text-center space-y-6 shadow-2xl border border-slate-700/80 my-4">
                    
                    <div class="space-y-2">
                        <span class="px-4 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs font-bold uppercase tracking-widest">
                            ${teacherBadge}
                        </span>
                        <h2 class="font-display font-black text-3xl sm:text-4xl text-white">Resultado do Desafio</h2>
                    </div>

                    <!-- Estrelas Animadas -->
                    <div class="flex items-center justify-center gap-4 py-2">
                        ${starsHTML}
                    </div>

                    <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 max-w-xl mx-auto">
                        <p class="text-slate-200 font-semibold text-sm sm:text-base leading-relaxed">
                            "${starsMsg}"
                        </p>
                        <p class="text-xs text-amber-400 font-bold mt-2">— Profe de Matemática</p>
                    </div>

                    <!-- Estatísticas em Quadrantes -->
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
                            <span class="block text-[10px] text-slate-400 uppercase font-bold">Aproveitamento</span>
                            <span class="font-display font-black text-2xl text-emerald-400">${percentage}%</span>
                        </div>
                        <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
                            <span class="block text-[10px] text-slate-400 uppercase font-bold">Acertos</span>
                            <span class="font-display font-black text-2xl text-slate-100">${state.correctCount} / 15</span>
                        </div>
                        <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
                            <span class="block text-[10px] text-slate-400 uppercase font-bold">Pontuação</span>
                            <span class="font-display font-black text-2xl text-amber-400">${state.score}</span>
                        </div>
                        <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
                            <span class="block text-[10px] text-slate-400 uppercase font-bold">Maior Combo</span>
                            <span class="font-display font-black text-2xl text-indigo-400">🔥 ${state.streak}</span>
                        </div>
                    </div>

                    <!-- Relatório Completo / Gabarito Comentado -->
                    <div class="text-left space-y-3 pt-4 border-t border-slate-800">
                        <div class="flex items-center justify-between">
                            <h4 class="font-display font-bold text-base text-slate-200">📋 Gabarito Comentado para Revisão:</h4>
                            <span class="text-xs text-slate-400">15 Questões</span>
                        </div>
                        <div class="max-h-64 overflow-y-auto space-y-2.5 pr-2">
                            ${state.answersHistory.map((item, idx) => `
                                <div class="p-3.5 rounded-2xl bg-slate-950/70 border ${item.isCorrect ? 'border-emerald-500/30' : 'border-rose-500/30'} text-xs space-y-1.5">
                                    <div class="flex items-center justify-between font-bold">
                                        <span class="${item.isCorrect ? 'text-emerald-400' : 'text-rose-400'}">
                                            Questão ${idx + 1} [${item.category}] — ${item.isCorrect ? 'Acertou ✓' : 'Errou ✕'}
                                        </span>
                                    </div>
                                    <p class="text-slate-300 font-medium">${item.question}</p>
                                    <div class="text-slate-400 space-y-0.5">
                                        <p>• <b>Sua opção:</b> ${item.userAnswer}</p>
                                        <p>• <b>Opção correta:</b> ${item.correctAnswer}</p>
                                    </div>
                                    <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 text-slate-300">
                                        ${item.explanation}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Botão Tentar Novamente -->
                    <button onclick="startGame()" class="w-full py-4 rounded-2xl font-display font-black text-lg text-slate-950 bg-gradient-to-r from-amber-400 via-yellow-300 to-emerald-400 hover:brightness-110 shadow-xl shadow-amber-500/20 transition-all flex items-center justify-center gap-2">
                        <span>JOGAR NOVAMENTE E REVISAR</span>
                        <svg class="w-5 h-5 stroke-slate-950 stroke-[3]" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    </button>
                </div>
            `;
        }

        /* ==========================================================================
           8. EFEITO DE CONFETES EM CANVAS
           ========================================================================== */
        function launchConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#6366F1', '#10B981', '#F59E0B', '#EC4899', '#38BDF8'];

            for (let i = 0; i < 140; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vy: Math.random() * 3.5 + 2,
                    vx: Math.random() * 2 - 1,
                    rotation: Math.random() * 360,
                    rotSpeed: Math.random() * 6 - 3
                });
            }

            let animationFrame;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    p.y += p.vy;
                    p.x += p.vx;
                    p.rotation += p.rotSpeed;

                    if (p.y < canvas.height) alive = true;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                if (alive) {
                    animationFrame = requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            render();
        }

        // Inicializar aplicação
        window.onload = function() {
            initApp();
        };

        // Redimensionar canvas de confetes
        window.onresize = function() {
            const canvas = document.getElementById('confettiCanvas');
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        };
    </script>
</body>
